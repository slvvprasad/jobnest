<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Student Registration</h1>

        <form id="studentForm">

            <label>Student Name:</label>
            <input type="text" id="studentName"
                   placeholder="Enter student name" required>

            <label>Roll Number:</label>
            <input type="text" id="rollNumber"
                   placeholder="Enter roll number" required>

            <label>Email:</label>
            <input type="email" id="studentEmail"
                   placeholder="Enter email" required>

            <label>Password:</label>
            <input type="password" id="studentPassword"
                   placeholder="Create password" required>

            <label>Phone Number:</label>
            <input type="tel" id="studentPhone"
                   placeholder="Enter phone number" required>

            <label>Branch:</label>
            <select id="studentBranch" required>
                <option value="">Select Branch</option>
                <option>CSE</option>
                <option>ECE</option>
                <option>EEE</option>
                <option>Mechanical</option>
                <option>Civil</option>
            </select>

            <label>Year of Study:</label>
            <select id="studentYear" required>
                <option value="">Select Year</option>
                <option>1st Year</option>
                <option>2nd Year</option>
                <option>3rd Year</option>
                <option>4th Year</option>
            </select>

            <button type="submit">Register Student</button>

        </form>

        <p>Already registered? <a href="index.html">Login Here</a></p>

        <p id="message"></p>

    </div>

    <script src="script.js"></script>

</body>
</html>
